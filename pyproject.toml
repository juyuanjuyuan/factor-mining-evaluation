[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "factor-mining"
version = "0.1.0"
description = "Modular cross-sectional equity factor evaluation"
requires-python = ">=3.10"
dependencies = [
  "matplotlib",
  "numpy",
  "pandas",
  "pyarrow",
]

[project.optional-dependencies]
webapp = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
]
mps = [
  "torch>=2.12",
]

[project.scripts]
evaluate-factor = "cli.factor:main"
evaluate-factor-standard = "cli.standard:main"
mine-factors-gp = "cli.genetic:main"
evaluate-alpha101 = "batch:main"
build-factor-dashboard = "reporting.dashboard:main"
validate-factor-registry = "factor_registry:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["cli*", "evaluation_standards*", "evaluators*", "genetic_mining*", "reporting*", "transforms*"]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["batch", "engine", "factor_registry", "funnel", "paths", "returns"]
